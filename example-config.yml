---
# =============================================================================
# enchanted-tenderduty — full reference config.
# Every field below corresponds to a real option in td2/types.go. Commented
# values are optional / have working defaults. Copy to config.yml and edit.
# Supported alert sinks: discord, telegram, slack, pagerduty, pushover.
# Supported chain types: cosmos (default), gnoland and espresso.
# =============================================================================

# --- general -----------------------------------------------------------------
# controls whether the web dashboard is enabled.
enable_dashboard: yes
# TCP port the dashboard listens on.
listen_port: 8888
# hide_logs: when yes, the dashboard suppresses the log feed and many node
# details. Use when posting the dashboard publicly.
hide_logs: no
# How long (minutes) to wait before alerting that an RPC node is down.
node_down_alert_minutes: 3
# Pagerduty severity for node-down alerts.
node_down_alert_severity: critical
# 0 disables; alert when an RPC node is more than N blocks behind the chain head.
node_lag_alert_blocks: 0

# --- prometheus --------------------------------------------------------------
prometheus_enabled: yes
prometheus_listen_port: 28686

# --- alert sinks (global) ----------------------------------------------------
# Each sink has its own `enabled` flag. A notification is delivered when the
# global sink is enabled AND the chain-level sink (under chains.<name>.alerts)
# is enabled. Leave `enabled: no` to disable.

# Pagerduty (https://pagerduty.com). Requires an Events API v1/v2 API key.
pagerduty:
  enabled: no
  api_key: aaaaaaaaaaaabbbbbbbbbbbbbcccccccccccc
  default_severity: alert

# Discord (webhook). Mentions is an optional list of role/user IDs to ping.
discord:
  enabled: no
  webhook: https://discord.com/api/webhooks/999999999999999999/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz
  mentions: []

# Telegram (bot). Get api_key from @BotFather; channel is the target chat ID.
telegram:
  enabled: no
  api_key: "5555555555:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  channel: "-666666666"
  mentions: []

# Slack (incoming webhook).
slack:
  enabled: no
  webhook: https://hooks.slack.com/services/AAAAAAAAAAAAAAAAAAAAAAA/bbbbbbbbbbbbbbbbbbbbbbbb
  mentions: []

# Pushover (https://pushover.net) — mobile push notifications.
# priority: -2..2. 2 = emergency, breaks through Do Not Disturb and repeats
# until acknowledged (requires retry/expire). resolved/recovery alerts are
# clamped to priority <= 0 so they never repeat.
pushover:
  enabled: no
  token: "APP_TOKEN_HERE"          # application API token from pushover.net
  user_key: "USER_KEY_HERE"        # your user/group key
  priority: 2                      # 2=emergency (needs retry/expire); 0=normal; -2=lowest
  sound: "persistent"             # optional sound name
  retry: 30                       # seconds between retries (emergency only, min 30)
  expire: 3600                    # seconds until retry expires (emergency only, max 10800)

# Healthcheck / dead-man's-switch ping.
healthcheck:
  enabled: no
  ping_url: https://hc-ping.com/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
  ping_rate: 60

# --- chains ------------------------------------------------------------------
chains:
  # ----- Cosmos / Evmos example (default provider) -----
  # Omitting `type:` defaults to cosmos: websocket block subscription +
  # cosmos-sdk staking/slashing queries.
  "Osmosis":
    chain_id: osmosis-1
    # network: mainnet or testnet — drives the dashboard's tabs. Optional; empty
    # = appears only in the "all" tab. Free-form otherwise (the chain name is too).
    network: mainnet
    # Validator OPERATOR (valoper) address. tenderduty derives the consensus
    # (valcons) key automatically via abci queries.
    valoper_address: osmovaloper1xxxxxxx...
    # Fall back to public RPC endpoints if all configured nodes fail (not recommended).
    public_fallback: no

    alerts:
      stalled_enabled: yes        # alert if no new blocks arrive
      stalled_minutes: 10         # minutes without a block before alerting

      consecutive_enabled: yes    # alert on N consecutive missed blocks
      consecutive_missed: 5
      consecutive_priority: critical   # pagerduty severity tag

      percentage_enabled: no      # alert on % of slashing window missed
      percentage_missed: 10
      percentage_priority: warning

      alert_if_inactive: yes      # alert if validator leaves the active set
      alert_if_no_servers: yes    # alert if no RPC nodes respond

      # Per-chain sink overrides. Empty api_key/webhook/channel fall back to the
      # global values. `enabled` must be yes both here and globally.
      pagerduty:
        enabled: yes
        api_key: ""               # blank = use global api_key
        default_severity: ""
      discord:
        enabled: yes
        webhook: ""               # blank = use global webhook
        mentions: []
      telegram:
        enabled: yes
        api_key: ""               # blank = use global api_key
        channel: ""               # blank = use global channel
        mentions: []
      slack:
        enabled: yes
        webhook: ""               # blank = use global webhook
        mentions: []
      pushover:
        enabled: yes
        token: ""                 # blank = use global token
        user_key: ""              # blank = use global user_key
        priority: 2               # override per chain (e.g. emergency for mainnet)
        sound: ""                 # blank = use global sound
        retry: 30
        expire: 3600

    nodes:
      - url: tcp://localhost:26657
        alert_if_down: yes
      - url: https://some-other-node:443
        alert_if_down: no

  # ----- Gnoland (gno.land / TM2) example -----
  # `type: gnoland` selects the gnoland provider: TM2 public nodes expose no
  # websocket, so it reads the head from every configured node (/status, every
  # 5s, max height wins) and evaluates EVERY height in between via
  # /commit?height=N — block-level accuracy even when blocks are faster than
  # the poll interval (gno.land mainnet is ~3.5s). A gno restart resumes from
  # the persisted last height, so a halted chain still raises its stalled alarm.
  # valoper_address is the OPERATOR address shown on gnoweb
  # (gno.land/r/gnops/valopers:<operator>). The signing/consensus address used
  # by /validators and /commit is auto-derived from the realm — do NOT put the
  # signing address here. The operator needs a profile in the valopers realm.
  "Gno-Mainnet":
    chain_id: gnoland-1
    network: mainnet
    type: gnoland
    valoper_address: g1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx   # OPERATOR addr (gnoweb)
    gno_valopers_realm: "gno.land/r/gnops/valopers"             # default; override only if needed
    # gno_signed_blocks_window: 10000                            # gno has NO on-chain slashing
    #                                                            # window; this LOCAL sliding window
    #                                                            # (last N blocks) drives uptime % +
    #                                                            # percentage. Default 10000 (~9.7h).
    alerts:
      stalled_enabled: yes
      stalled_minutes: 5
      consecutive_enabled: yes      # primary gno alert
      consecutive_missed: 10
      consecutive_priority: critical
      percentage_enabled: no
      percentage_missed: 10
      percentage_priority: warning
      alert_if_inactive: yes
      alert_if_no_servers: yes
      # Blank sink credentials fall back to the global values; `enabled` must be
      # yes both here and globally.
      discord:
        enabled: yes
        webhook: ""
      telegram:
        enabled: yes
        api_key: ""
        channel: ""
      pushover:
        enabled: yes
        priority: 2
        retry: 30
        expire: 3600
    nodes:
      # Head detection polls all nodes and picks the highest height; commit
      # fetches fall back to any healthy node. Two independent endpoints avoid
      # a single stale RPC freezing monitoring.
      - url: https://rpc.gno.land:443
        alert_if_down: yes
      - url: https://gnoland-mainnet-rpc.itrocket.net:443
        alert_if_down: yes

  # ----- Espresso (HotShot) example -----
  # `type: espresso` selects the HotShot/Espresso provider. Espresso has no
  # cosmos staking/slashing and no TM2 websocket, and the public query service
  # returns per-epoch participation RATES only (too coarse to alert on). Missed
  # proposals are therefore counted on the validator's own Status API:
  #   consensus_view_duration_as_leader_count  = leader duties assigned
  #   consensus_number_of_timeouts_as_leader   = leader duties missed
  # proposals = assigned - missed. A counter drop means the node restarted, so
  # the baseline is re-seeded instead of reporting bogus deltas.
  # nodes = query-service endpoints (chain head; poll-all, max height wins).
  # espresso_node_url = YOUR validator's own Status API (ESPRESSO_NODE_API_PORT;
  # default 8080, the community guide exposes 28181). The duty counters are
  # node-local, so another operator's node would report THEIR proposals. It
  # serves plain HTTP — put it behind an HTTPS reverse proxy or allow only the
  # monitoring host. Without it, stalls/lag are still monitored but leader
  # duties are not. espresso_staking_key is optional (discovered from
  # /v1/status/keys); when set, a node reporting a different key disables duty
  # monitoring instead of tracking a foreign validator.
  "Espresso-M":
    chain_id: espresso-mainnet-1        # cosmetic; identity is the BLS key
    network: mainnet
    type: espresso
    espresso_node_url: https://espresso-node.example.com:28181
    # espresso_staking_key: BLS_VER_KEY~...   # blank = auto-discover from the node
    espresso_duty_window: 1000          # recent leader duties for uptime % +
                                        # percentage_missed (real counts)
    espresso_vote_lag_views: 100        # current_view - last_voted_view before a
                                        # "not voting" warning (~45s)
    # Every 2 minutes the provider also reads the query service's per-epoch
    # participation ratio and credits misses the node counters could not see
    # (a leader slot that expired while the node was down for an upgrade) into
    # the epoch tally + duty window — log line starts with ⚖️.
    alerts:
      stalled_enabled: yes
      stalled_minutes: 3
      consecutive_enabled: yes
      consecutive_missed: 1             # 1 = alert on every missed leader duty
      consecutive_priority: critical
      percentage_enabled: yes
      percentage_missed: 1              # >1% missed over the duty window
      percentage_priority: warning
      alert_if_inactive: yes
      alert_if_no_servers: yes
      discord:
        enabled: yes
        webhook: ""
      telegram:
        enabled: yes
        api_key: ""
        channel: ""
    nodes:
      - url: https://query.main.net.espresso.network
        alert_if_down: yes
      # Add your own query node (or another public one) as a second endpoint:
      # head detection takes the highest height, so one stale service cannot
      # freeze monitoring.

  # ---- Espresso validator on the Decaf testnet ----
  # Identical provider and node Status API; only the L1 (Ethereum Sepolia),
  # stake-table contract and query service differ. Decaf epochs are short
  # (~3,000 blocks ≈ 35–40 min), so the epoch tally resets often — rely on
  # consecutive_missed and the duty-window percentage. Decaf ESP is not
  # publicly distributed: register on Sepolia, then request a delegation in
  # #decaf-node-ops on the Espresso Discord.
  "Espresso-Decaf":
    chain_id: espresso-decaf-testnet   # cosmetic; identity is the BLS key
    network: testnet
    type: espresso
    espresso_node_url: https://espresso-node.example.com:28181
    # espresso_staking_key: BLS_VER_KEY~...   # blank = auto-discover from the node
    espresso_duty_window: 1000
    espresso_vote_lag_views: 100
    alerts:
      stalled_enabled: yes
      stalled_minutes: 3
      consecutive_enabled: yes
      consecutive_missed: 1
      consecutive_priority: critical
      percentage_enabled: yes
      percentage_missed: 1
      percentage_priority: warning
      alert_if_inactive: yes
      alert_if_no_servers: yes
      discord:
        enabled: yes
        webhook: ""
      telegram:
        enabled: yes
        api_key: ""
        channel: ""
    nodes:
      - url: https://query.decaf.testnet.espresso.network
        alert_if_down: yes

